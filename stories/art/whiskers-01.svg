<title id="t">The Lion's Whiskers</title>
<desc id="d">Paper-cut cover: in the Ethiopian highlands, under flat-topped blue mountains, a woman in a long white dress with a woven teal-and-gold border and a white shawl stands on the left holding a basket of meat. On the right a big lion with a dark brown mane lies calmly on the golden grass in front of his grey rocks and an acacia tree, looking at her with curious eyes.</desc>
