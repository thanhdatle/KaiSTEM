<title id="t">Elephant has a plan</title>
<desc id="d">Paper-cut scene: a huge grey elephant with flappy ears, a curling trunk and white tusks, much bigger than the little house, says she will SIT on it. Rabbit, small beside her, holds up her paw: No, no, that's my house! The doorway is dark and empty.</desc>
