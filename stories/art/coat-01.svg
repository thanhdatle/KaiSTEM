<title id="t">Eat, My Coat, Eat!</title>
<desc id="d">Paper-cut scene: on a sunny village road in Türkiye, with white houses, red-tile roofs and blue mountains behind, Nasreddin Hodja stands smiling in his patched brown work robe, with his big white turban and white beard. Beside him little Elif in a yellow dress waves, and his grey donkey with a striped saddle cloth stands on the other side.</desc>
