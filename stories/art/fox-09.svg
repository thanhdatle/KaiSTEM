<title id="t">Down, down, down!</title>
<desc id="d">Paper-cut scene: the fox hangs on a long grass rope that comes down from the clouds at the top, high above the snowy mountains. Three small green parrots fly past, and the fox shouts rude names at them with his mouth wide open.</desc>
