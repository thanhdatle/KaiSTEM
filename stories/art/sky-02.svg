<title id="t">When the sky was low</title>
<desc id="d">Paper-cut scene: long ago the sky was so low it was like a bumpy blue ceiling just over the village. A man in a white shirt and blue trousers holds his head with both hands because a puffy cloud has bumped into it, and a little boy in a teal top and blue shorts stands under another cloud, giggling. A coconut palm is bent sideways under the sky, and a bamboo house on stilts stands with its roof nearly touching it.</desc>
