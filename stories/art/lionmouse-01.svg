<title id="t">The Lion and the Mouse</title>
<desc id="d">Paper-cut cover: on a sunny Greek hillside, a huge golden lion with a big orange-brown mane lies asleep under a silvery-green olive tree, his head resting near his paws. On the right, a tiny grey mouse with pink ears sits up beside her hole under a grey rock and looks at him.</desc>
