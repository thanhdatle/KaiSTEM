<title id="t">At home in the sky</title>
<desc id="d">Paper-cut scene: high up in the big blue sky, the Sun and the Moon sit on two soft white clouds, waving happily. Far below, the sea sparkles, with the tip of the old roof, a whale and leaping fish.</desc>
