<title id="t">A fancy yellow dress</title>
<desc id="d">Paper-cut scene: by the turquoise house, Juan Bobo grins and holds up Mamá's fancy yellow dress with pink flowers and a pink sash. The pink pig looks up at it with a happy smile.</desc>
