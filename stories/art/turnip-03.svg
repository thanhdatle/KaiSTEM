<title id="t">The sun shines and the rain falls</title>
<desc id="d">Paper-cut scene: the smiling sun shines on one side of the sky and a grey rain cloud sprinkles blue raindrops on the other, while in the garden a round purple-topped turnip pushes up out of the earth with big leaves, growing bigger every day.</desc>
