<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Stomp, stomp, far away</title>
<desc id="d">Paper-cut scene: far away over the green mountains, the tree spirit, now very small, hurries off on its root feet, leaning forward. Nearby, white egrets come back to a leafy tree with a nest in it. In front, Lạc Long Quân, two villagers and two children smile and wave.</desc>
