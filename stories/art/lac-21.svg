<title id="t">Down the mountain path</title>
<desc id="d">Paper-cut scene: a winding path leads down from the green mountains to the lowlands, where a river shines. Âu Cơ, small in the distance, walks down the path among flowers, and a white egret flies ahead of her toward the lowlands.</desc>
