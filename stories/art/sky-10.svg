<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Whoosh!</title>
<desc id="d">Paper-cut scene: whoosh! The bumpy blue sky flies up and up, high over the village, with white lines rushing upward. Just under it, very small, float the woman's comb and her bead necklace, carried away with the sky. Two clouds rise too, smiling. Down below, the woman holds her pestle up and looks up with her mouth open in surprise, the palm tree springs up straight, and the bamboo house stands tall.</desc>
