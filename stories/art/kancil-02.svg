<title id="t">Kancil the mouse-deer</title>
<desc id="d">Paper-cut scene: in the green jungle, Kancil the mouse-deer stands among ferns that tower over him. He is small and reddish-brown, with a round body, legs as thin as sticks, round ears, white stripes on his throat, a big shiny eye and no antlers. A yellow butterfly flutters near his nose.</desc>
