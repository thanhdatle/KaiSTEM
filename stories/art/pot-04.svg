<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">One seed for every child</title>
<desc id="d">Paper-cut scene: in front of the red palace, the old emperor in his yellow robe holds a golden bowl of seeds and smiles. Four children stand in a row beside him — a girl in pink, a boy in orange, a girl in green, and Ping in blue, nearest the emperor. Ping holds out one hand towards the emperor with a single small seed on it, sparkling, and his mouth is open in wonder.</desc>
