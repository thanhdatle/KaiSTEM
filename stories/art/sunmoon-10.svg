<title id="t">Up, up into the sky</title>
<desc id="d">Paper-cut scene: last of all comes the big blue whale, and the water rises over the roof until only the very tip of the thatch pokes out. Holding hands, the Sun and the Moon float gently up into the sky, while the whale sprays a fountain of water below them and Water waves goodbye.</desc>
