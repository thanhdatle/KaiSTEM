<title id="t">SPLASH!</title>
<desc id="d">Paper-cut scene: SPLASH! Beside the dirt road, the pig in her yellow dress and pearls has jumped right into a big brown mud puddle. Mud flies up all around her and there are brown splotches all over her dress and face, and she is grinning with her eyes shut in joy. The little white church is on the hill behind.</desc>
