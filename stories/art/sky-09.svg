<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">One, two, three — PUSH!</title>
<desc id="d">Paper-cut scene: the woman stands up on her tiptoes, holds her long pestle with both hands high above her head, and gives the low sky a great big push, with a big yellow burst where the pestle presses it. White lines show the sky starting to move up. Her comb and necklace still hang on the sky. The two little clouds have woken up with surprised faces.</desc>
