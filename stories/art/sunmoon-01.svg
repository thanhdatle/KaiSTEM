<title id="t">Why the Sun and the Moon Live in the Sky</title>
<desc id="d">Paper-cut cover: in an evening sky that fades from deep purple-blue at the top to pink and peach at the bottom, the smiling golden Sun and the silver Moon in her purple headwrap shine side by side. Below, the top of a round thatched roof pokes up out of the sea, and a whale, an octopus and leaping fish play in the water beside friendly Water, a big smiling wave.</desc>
