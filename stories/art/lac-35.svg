<title id="t">Mountain or sea, we'll help each other!</title>
<desc id="d">Paper-cut scene with the sea on the left and the mountains on the right, joined by a rainbow across the sky. Lạc Long Quân and Âu Cơ hold hands in the middle, smiling, with four children around them throwing their arms up. High in the sky on the mountain side flies a white egret.</desc>
