<title id="t">Hot, hot, hot!</title>
<desc id="d">Paper-cut scene on the sea: Lạc Long Quân, in his teal tunic and teal plumes, stands in a long wooden boat with a bird-head prow and throws a glowing orange-red stone. On the right, the giant blue fish spirit has opened its big mouth wide to gobble, and the hot stone is flying straight toward it.</desc>
