<title id="t">Up to their tummies</title>
<desc id="d">Paper-cut scene: more of Water's people have come in, and the water in the courtyard is up to the tummies of the Sun and the Moon; the Sun throws up his arms and the Moon holds hers out wide, and both laugh. Three red crabs, a green turtle and the three fish swim around them, and the water covers the bottom of the round house's door.</desc>
