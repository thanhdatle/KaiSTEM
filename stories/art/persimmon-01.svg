<title id="t">The Tiger and the Dried Persimmon</title>
<desc id="d">Paper-cut cover: on a snowy moonlit night in the Korean mountains, a big orange-and-black striped tiger stands in the snow and stares in surprise at a little village cottage with a thick straw roof and glowing paper windows. Strings of orange dried persimmons hang under the cottage's snowy eaves.</desc>
