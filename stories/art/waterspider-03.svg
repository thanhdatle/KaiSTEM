<title id="t">The Thunders send their lightning</title>
<desc id="d">Paper-cut scene: a big dark storm cloud — the Thunders — sends a bright zig-zag bolt of lightning down onto the top of a tall pale hollow sycamore tree on a little island in a lake. At the bottom of the tree, inside a hollow, an orange fire begins to glow.</desc>
