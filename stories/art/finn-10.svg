<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Ouch! Too hard!</title>
<desc id="d">Paper-cut scene: inside the giant house, Benandonner stands by the door, so tall his head reaches right up to the roof beams. He holds out a bitten griddle cake with a grey stone showing in the bite, and rubs his cheek with his other hand, one eye squeezed shut: ouch! A little yellow star pops out by his cheek. Oonagh holds a plate of cakes and smiles, and Finn peeks from the giant cradle.</desc>
