<title id="t">Talking and talking</title>
<desc id="d">Paper-cut scene at sunset beside the river: Âu Cơ and Lạc Long Quân stand facing each other, both laughing happily as they talk. A little fish leaps out of the river behind him, and a white egret flies across the indigo and purple sky behind her.</desc>
