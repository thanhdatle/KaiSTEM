<title id="t">Âu Cơ, the mountain fairy</title>
<desc id="d">Paper-cut scene high in misty green mountains: the fairy Âu Cơ stands in a meadow of pink, yellow and white flowers, smiling and holding up a pink flower. She has long black hair, a crown of white feathers and flowers, a peach top and a rose wrap skirt with a patterned band. A white egret stands beside her, and two more fly among the peaks.</desc>
