<title id="t">Hodja in his garden</title>
<desc id="d">Paper-cut scene: Nasreddin Hodja, in his big white turban and patched brown work robe tied with a rope, digs in his vegetable garden with a hoe. His robe is dusty, the sun is high, and rows of green plants with red tomatoes grow beside him. His grey donkey rests by a little white house with a red roof.</desc>
