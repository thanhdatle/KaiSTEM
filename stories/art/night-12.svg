<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">The morning birds</title>
<desc id="d">Paper-cut scene: at dawn the sky glows pink and orange, with one bright morning star still shining. On the riverbank the daughter of the Great Snake holds up a ball of string. On a branch to the right, a glossy black cujubim bird with a white crested head, a red throat and red legs sings to the morning, and on the grass below sits a round, soft grey-brown inambu bird.</desc>
