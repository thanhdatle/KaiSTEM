<title id="t">Stomp, stomp, stomp, home!</title>
<desc id="d">Paper-cut scene: Benandonner runs back across the sea towards Scotland as fast as he can, looking back over his shoulder in a worry. Behind him the stepping stones he has kicked away fly up into the air and land with big white splashes, leaving a gap in the path. The part of the path near the Irish cliff is still there.</desc>
