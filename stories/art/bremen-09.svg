<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">All together — sing!</title>
<desc id="d">Paper-cut scene at night: the four animals, still standing on each other's backs by the window — donkey, dog, cat and rooster — all sing at once with their mouths wide open, and four big spiky noise-bursts in grey, brown, orange and red burst out around them. The house door has flown open and the two robbers in striped shirts tumble out, arms in the air and one hat flying off, running away.</desc>
