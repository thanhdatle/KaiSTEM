<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">There is no night!</title>
<desc id="d">Paper-cut scene: in front of the thatched house, still under a blazing sun, the daughter of the Great Snake stands with long black hair, a pink flower and a green dress patterned like scales. She looks tired and points one hand down towards the river. Beside her, with a little gap between them, her husband in a purple shirt listens with a surprised look. The river shines below them.</desc>
