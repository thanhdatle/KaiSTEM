<title id="t">Thump!</title>
<desc id="d">Paper-cut scene: in front of the cowshed, the sneaky thief has jumped onto the tiger's back thinking he is a big cow, and sits there grinning and holding on. The tiger's eyes are huge with fright and he is trembling all over. Inside the shed, the real cow watches with her mouth open.</desc>
