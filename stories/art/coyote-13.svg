<title id="t">The rabbit in the moon</title>
<desc id="d">Paper-cut night scene: an enormous pale-yellow full moon fills the starry sky, and in its shadows you can see the shape of a rabbit. Down below, the little grey-brown rabbit peeks happily out of his burrow beside a prickly-pear cactus and looks up at it.</desc>
