<title id="t">As big as a hill</title>
<desc id="d">Paper-cut scene: Tiddalik sits huge and swollen, as big as a hill, with all the water sloshing inside his tummy. All around him the red earth is dry and cracked, the waterhole is only mud, and the gum trees droop in the heat.</desc>
