<title id="t">Pat, pat, pat</title>
<desc id="d">Paper-cut scene: in the little garden by his white house, Ping reaches out and pats the brown soil in his blue-and-white pot, which stands on a low stone bench. Little lines show the pat, pat, pat. A green watering can waits on the grass. There is nothing growing in the pot.</desc>
