<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Benandonner</title>
<desc id="d">Paper-cut scene: the stepping-stone path now reaches almost all the way across the sea. Finn McCool stands on it, eyes wide and mouth in a round 'oh', hands on his cheeks. On the Scottish shore stands Benandonner, a giant even bigger than Finn, with a bushy dark beard, a blue tunic and a red tartan kilt, hands on his hips, booming across the water.</desc>
