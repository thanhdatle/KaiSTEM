<title id="t">Dress!</title>
<desc id="d">Paper-cut scene: the pink pig now wears Mamá's fancy yellow dress with pink and white flowers, a ruffled hem and a big pink bow on her back, and smiles proudly. Juan Bobo points at her with a big grin. Across the top a little paper list shows one thing: a yellow dress.</desc>
