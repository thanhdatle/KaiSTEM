<title id="t">The King has sent me</title>
<desc id="d">Paper-cut scene, close up: tiny Kancil stands tall at the edge of the riverbank and speaks to a big crocodile floating in the water below him. The crocodile, more than twice as long as Kancil, looks up at him with a friendly grin, its long snout and little white teeth pointing toward the bank.</desc>
