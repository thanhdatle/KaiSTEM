<title id="t">Ping could make anything grow</title>
<desc id="d">Paper-cut scene: outside a little white house with a grey tiled roof, the boy Ping stands smiling in his garden, pouring water from a green watering can onto a row of big, bright flowers — pink, yellow, red and white. A pink blossom tree grows beside the house.</desc>
