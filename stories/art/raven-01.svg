<title id="t">The Owl and the Raven</title>
<desc id="d">Paper-cut cover: under a bright blue Arctic sky, two plain white birds stand side by side on the snow in front of a round snow house: a round snowy owl with big yellow eyes on the right, and a raven with a big heavy dark beak on the left, facing her. Neither has any spots or black feathers yet.</desc>
