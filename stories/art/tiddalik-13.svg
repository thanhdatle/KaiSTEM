<title id="t">Water is for sharing</title>
<desc id="d">Paper-cut scene: the land is green again and the billabong is full. Tiddalik, a little frog once more, smiles on the bank while Kangaroo, Emu and Wombat come to drink, Eel peeks out of the water, Koala sits by the gum tree and Kookaburra perches above.</desc>
