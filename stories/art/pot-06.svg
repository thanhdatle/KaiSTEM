<title id="t">A bigger pot, more sunshine</title>
<desc id="d">Paper-cut scene: under a big yellow sun, Ping lifts a bigger blue-and-white pot of rich brown soil up towards the sunshine, hoping. Nothing is growing in it. A pink blossom tree and the little white house are behind him.</desc>
