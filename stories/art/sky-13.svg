<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">The moon and the stars</title>
<desc id="d">Paper-cut night scene: high up in the deep blue night sky shines a glowing half-moon shaped just like the woman's comb, with a gentle smiling face and faint comb teeth along its flat edge. All around it, cream and gold stars twinkle, just like the beads of her necklace. Down below, beside her bamboo house with a warm yellow window and a dark palm tree, the woman smiles and points up at the moon.</desc>
