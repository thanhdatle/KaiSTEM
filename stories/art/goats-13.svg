<title id="t">Fat and happy on the hillside</title>
<desc id="d">Paper-cut scene: in the warm golden light, the three billy goats Gruff — little, middle and big — munch sweet green grass on the hillside among yellow, pink and white flowers. They have grown round and well-fed, and snowy mountains rise behind them.</desc>
