<title id="t">Rhino has a plan</title>
<desc id="d">Paper-cut scene: a grey rhino with a big horn and a small horn on her nose comes to bump the little house over. Rabbit holds up her paw: No, no, that's my house! A big yellow shout-burst bursts out of the dark doorway, and the rhino's eyes go wide.</desc>
