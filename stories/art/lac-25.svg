<title id="t">A big surprise: a bọc!</title>
<desc id="d">Paper-cut scene in front of the big stilt house: on a mat of green banana leaves rests a large, soft, pearly pink bundle — the bọc — glowing softly. Âu Cơ stands beside it with her arms open, delighted, and Lạc Long Quân stands on the other side, amazed, his mouth a little O.</desc>
