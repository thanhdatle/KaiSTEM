<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Raven comes back black</title>
<desc id="d">Paper-cut scene: on the snowy shore, the raven is back without the fire. He is now glossy black all over, with his eyes squeezed shut, coughing out little grey puffs of smoke. On his left the screech owl, the hooting owl and the horned owl stare at him; on his right the pale snake and the tiny water spider look on.</desc>
