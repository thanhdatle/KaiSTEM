<title id="t">Griddle cakes</title>
<desc id="d">Paper-cut scene: inside the giant house, Oonagh stands in front of the fireplace next to a wooden table with three round golden griddle cakes on it. In her hand she holds a fourth cake with a flat grey stone pressed into its middle, and she smiles a secret smile. Over in the giant cradle, Finn in his baby bonnet peeks out to watch.</desc>
