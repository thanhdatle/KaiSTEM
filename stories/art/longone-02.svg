<title id="t">Rabbit hops home</title>
<desc id="d">Paper-cut scene: Rabbit, a long-eared brown hare, hops happily along a sandy path towards her little round house, which has mud walls, a thatched roof, a red mat and a pot of flowers by the dark doorway. Kilimanjaro rises far away, and two birds fly in the blue sky.</desc>
