<title id="t">Water comes in, up to their knees</title>
<desc id="d">Paper-cut scene: inside the compound, Water, the big blue wave, pours in through the open gate. The water is up to the knees of the Sun and the Moon, who stand in the courtyard smiling, and three fish — orange, teal and pink — swim around their feet.</desc>
