<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Finn and Oonagh</title>
<desc id="d">Paper-cut scene: on a green clifftop by the sea, the giant Finn McCool, with ginger hair, freckles and a green tunic, stands smiling next to his wife Oonagh in a purple dress and cream apron, with a long chestnut plait and a yellow flower in her hair. Behind them is their big white house with a golden thatched roof. Four tiny sheep graze around their feet, no bigger than the giants' boots.</desc>
