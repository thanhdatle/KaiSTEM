<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Night at last</title>
<desc id="d">Paper-cut scene: the first night lies softly over the forest. Stars twinkle in a deep blue sky, yellow fireflies glow, and two little green frogs sing on lily pads in the dark river, their throats puffed up. On the bank, the daughter of the Great Snake stands beside the glowing doorway of the thatched house, smiling.</desc>
