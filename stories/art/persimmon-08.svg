<title id="t">Hiding in the cowshed</title>
<desc id="d">Paper-cut scene: inside a dark wooden cowshed with straw on the floor, a brown cow turns her face in surprise with her mouth open in a 'Moo?'. In front of her, the big tiger crouches low in the straw, trembling, with his tail tucked down and his eyes wide.</desc>
