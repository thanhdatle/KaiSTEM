<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Mamá laughs</title>
<desc id="d">Paper-cut scene: back home by the turquoise house, Mamá in her blue Sunday dress laughs with her eyes crinkled and her hands together at her chest. Juan Bobo scratches his head under his straw hat with a sheepish smile. The pig stands beside them, splotched all over with mud on her yellow dress, pearls and red shoes, smiling.</desc>
