<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">The giant fish spirit</title>
<desc id="d">Paper-cut scene on a grey, stormy sea: a giant slate-blue fish spirit with orange spiky fins, a row of little fins underneath and a grumpy frown thrashes in the water, making big waves. Two little wooden boats with bird-head prows are tossed about. On the shore at the bottom left, a man, a woman and a child look on, worried.</desc>
