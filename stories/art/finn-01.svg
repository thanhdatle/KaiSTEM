<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Finn McCool and the Giant's Causeway</title>
<desc id="d">Paper-cut cover: the giant Finn McCool, with ginger hair and a green tunic, stands out in the sea on a path of six-sided stepping stones, carrying another stone in his arms and smiling. Behind him the path runs back to a green Irish cliff, where his wife Oonagh, in a purple dress with a long plait, waves. A tiny red fishing boat bobs on the sea far smaller than Finn's boot, the purple hills of Scotland lie across the water, and seagulls fly overhead.</desc>
