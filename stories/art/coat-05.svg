<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Nobody passes the soup</title>
<desc id="d">Paper-cut scene: Hodja, in his dusty patched robe, sits all alone on a little cushion near the gate, with nothing in front of him and a wobbly tummy-rumble beside him. At the copper table, the host holds out a bowl of soup to the guests, and the three guests eat and chat with each other. Nobody looks at Hodja.</desc>
