<title id="t">A beautiful spotted dress</title>
<desc id="d">Paper-cut scene: the owl has a finished dress of black dots all over her body, wings and the top of her head, like a real snowy owl. She flings her wings out and up for joy, with sparkles around her. The white raven raises a wing to cheer.</desc>
