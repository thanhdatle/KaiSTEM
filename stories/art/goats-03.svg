<title id="t">Green grass across the river</title>
<desc id="d">Paper-cut scene: the three billy goats stand on the dry, brown side of a river where all the grass has been eaten, looking across a wooden bridge at the green hillside on the other side, full of grass and flowers. The bridge is quiet, and the space under it is dark and empty.</desc>
