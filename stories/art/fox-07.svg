<title id="t">Oh no!</title>
<desc id="d">Paper-cut scene: the condor flies away to the right, high in the sky, with whoosh lines behind him. On the cloud below, the fox sits all alone beside the striped cloth and the empty clay bowls, looking sad.</desc>
