<title id="t">Scrub-a-dub!</title>
<desc id="d">Paper-cut scene in warm evening light: the clean pink pig sits in a big tin washtub full of white soap bubbles, grinning with her eyes shut. Juan Bobo scrubs her with a wooden brush, and Mamá pours water from a bucket. The yellow dress hangs drying on a washing line behind them.</desc>
