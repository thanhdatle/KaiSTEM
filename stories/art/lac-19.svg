<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Houses up high</title>
<desc id="d">Paper-cut scene on a sunny day: villagers are building houses on stilts. On the left, a frame of wooden posts stands on a raised platform with a ladder; on the right, a finished house on tall stilts has woven walls and a saddle-shaped thatched roof whose ends sweep up like a boat. Lạc Long Quân points to show the way, a man carries a long wooden post, a child helps, and a woman waves.</desc>
