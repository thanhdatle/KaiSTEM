<title id="t">The Fox and the Sky Feast</title>
<desc id="d">Paper-cut cover: high above the snowy Andes mountains, the great black condor with his white collar and white wing patches flies with his wings raised, and a red-brown Andean fox with tall pointed ears and a bushy black-tipped tail rides on his back, smiling. White clouds float around them.</desc>
