<title id="t">The spotted owl and the black raven</title>
<desc id="d">Paper-cut scene: at night under twinkling stars and green and purple northern lights, the spotted snowy owl and the shiny black raven in his brown boots stand side by side on a big white snowdrift. Off to the right, the snow house glows with warm light at its door.</desc>
