<title id="t">Oink, oink! Squeal!</title>
<desc id="d">Paper-cut scene: the pink pig stands with her eyes squeezed shut and her mouth wide open, squealing loudly towards the little white church on the far hill. Juan Bobo stands beside her with his mouth in a surprised O and his hands up by his face.</desc>
