<title id="t">The big compound is ready</title>
<desc id="d">Paper-cut scene: a huge new compound with a long round mud wall decorated with white zigzags, a wide open gate, and the thatched cone roofs of four round houses rising behind it. The Sun and the Moon stand in front of the gate, waving to invite their friend Water.</desc>
