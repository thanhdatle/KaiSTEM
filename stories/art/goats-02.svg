<title id="t">Three billy goats called Gruff</title>
<desc id="d">Paper-cut scene: three billy goats stand in a row on a dry, brown hillside, smiling — a little white goat with tiny horn bumps, a middle-sized tan goat with short horns and a little beard, and a big grey-brown goat with huge curly horns and a long beard.</desc>
