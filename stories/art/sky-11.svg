<title id="t">Room to stand tall</title>
<desc id="d">Paper-cut scene: now the sky is high and wide and blue, with clouds far up. The woman pounds her rice with her long pestle held high, smiling; the man in the white shirt stretches both arms up to the sky, and the little boy in the teal top jumps for joy. The coconut palm stands straight and tall, and the bamboo house is on the right.</desc>
