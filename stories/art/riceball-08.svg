<title id="t">The mouse village</title>
<desc id="d">Paper-cut scene underground: a cosy mouse village of tiny houses with lit windows and glowing paper lanterns, where many little mice in kimono bow politely to a smiling Grandpa; the lead mouse wears a red headband.</desc>
