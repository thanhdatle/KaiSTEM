<title id="t">Here's a gotgam!</title>
<desc id="d">Paper-cut scene: the crying lines have gone. On the window paper, the shadow of the mother holds a small round dried persimmon up to her baby, and all is quiet. Outside, the tiger's eyes are wide and his mouth is a small round O. Right beside him, strings of real dried persimmons hang under the eaves.</desc>
