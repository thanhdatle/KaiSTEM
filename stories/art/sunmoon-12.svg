<title id="t">The Sun shines on everybody</title>
<desc id="d">Paper-cut scene: by day the big golden Sun beams down from the sky, and below him Water and all his people splash and play: a whale sprays a fountain, an octopus waves, a crab sits on a rock, the turtle swims and fish leap out of the sparkling sea. A pale daytime Moon smiles faintly in a corner of the sky.</desc>
