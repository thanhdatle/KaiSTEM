<title id="t">Still best friends</title>
<desc id="d">Paper-cut scene: the black raven stands tall and shiny, his feathers gleaming with blue sparkles, and laughs with his eyes closed, one wing up. The spotted owl laughs too, wings out. A pink heart floats between them over the rug, and the little pot stands upright again.</desc>
