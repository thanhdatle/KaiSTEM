<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">At the bottom of the river</title>
<desc id="d">Paper-cut scene: deep under the green river, among waving water-weeds and pebbles, the Great Snake rests along the sandy riverbed in gentle curves: long and teal-green, with a pale yellow belly, dark spots and a kind face. Snuggled against a curve of his body is a dark tucumã nut sealed with golden wax, glowing softly. Bubbles float up.</desc>
