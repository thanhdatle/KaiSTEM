<title id="t">The sky feast</title>
<desc id="d">Paper-cut scene: on top of the clouds a striped Andean cloth is spread with three clay bowls, of quinoa, potatoes and corn. The fox gobbles from the quinoa bowl with his cheeks stuffed full and seeds stuck in his fur, while the condor stands on the other side of the cloth.</desc>
