<title id="t">A sneaky cow thief</title>
<desc id="d">Paper-cut scene: a silly sneaky man in a grey-blue jacket and a dark headscarf tiptoes through the snow with an empty sack over his shoulder, heading for the dark cowshed. He has a sly little smile. Inside the shed, the cow and the crouching tiger are just dim shapes in the dark.</desc>
