<title id="t">A TIGER!</title>
<desc id="d">Paper-cut scene: at dawn, as the sky turns pink, the thief has tumbled off into a soft snowdrift and sits up in it, wide-eyed, with his arms in the air, snow on his head and a puff of snow flying around him. His empty sack lies nearby. Further off on the right, the tiger races away towards the mountains, still frightened.</desc>
