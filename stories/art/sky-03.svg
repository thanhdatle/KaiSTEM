<title id="t">Pounding rice</title>
<desc id="d">Paper-cut scene: under the low bumpy sky, a smiling woman in a coral blouse and purple striped skirt, with a half-round comb in her hair and a necklace of cream and gold beads, holds her long wooden pestle upright in a wooden mortar full of white rice. Her bamboo house on stilts is behind her on the right, a bent coconut palm is on the left, and a white hen pecks nearby.</desc>
