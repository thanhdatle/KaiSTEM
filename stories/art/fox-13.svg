<title id="t">Thank you, Condor!</title>
<desc id="d">Paper-cut scene: in warm golden light, the fox sits politely on the grass, with bright quinoa plants growing nearby, smiling up at the big condor standing on a rock beside him. Two green parrots fly happily overhead, and snowy mountains rise behind.</desc>
