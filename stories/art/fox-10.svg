<title id="t">Peck, peck, SNAP!</title>
<desc id="d">Paper-cut scene: two small green parrots peck at the grass rope high up near the clouds, and the rope is fraying with snap marks. A third parrot flaps nearby. Lower down, the fox clings to the rope and looks up in surprise.</desc>
