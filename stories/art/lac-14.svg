<title id="t">The grumpy tree spirit</title>
<desc id="d">Paper-cut scene in misty green hills: a huge, gnarled old tree spirit with a grumpy face in its bark stomps on its root feet and shakes its branch arms, so leaves fly everywhere. White egrets fly away from it. On the left, a villager and a child peek out, worried, from behind a big rock.</desc>
