<title id="t">Creeping to the village</title>
<desc id="d">Paper-cut scene: the tiger tiptoes through the snow towards a village cottage with a thick snowy straw roof, glowing paper windows and strings of dried persimmons under its eaves, and a wooden cowshed beside it where a brown cow is standing inside. His paw prints trail behind him.</desc>
