<title id="t">Skate, skate, skate across the water!</title>
<desc id="d">Paper-cut scene: the little water spider, with her empty woven bowl on her back, skates fast across the top of the lake, her eight feet making tiny white ripples and speed lines behind her. Ahead, on the island, the tall tree glows orange at the bottom with smoke curling out of the top.</desc>
