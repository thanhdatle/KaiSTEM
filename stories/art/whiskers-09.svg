<title id="t">Day five</title>
<desc id="d">Paper-cut scene: five little suns in the top corner for day five. Bizunesh sits on the grass right beside the big lion, smiling. The lion eats from the clay dish next to her, peaceful, with his eyes softly closed.</desc>
