<title id="t">Grow, little seed, grow!</title>
<desc id="d">Paper-cut scene: in the palace garden in warm golden light, the old emperor and Ping stand side by side, both smiling. Ping now wears a golden sash. Between them, a new clay pot has a green sprout with two leaves and one pink flower just opening. Flowers grow all around, and the golden palace roof rises behind them.</desc>
