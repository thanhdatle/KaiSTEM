<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Up onto the roof</title>
<desc id="d">Paper-cut scene: the whole compound is under water — the walls have disappeared below the waves, and only thatched roof tops poke out. The water is right up to the roof of the big round house, so the Sun and the Moon sit high on the roof, one on each side, smiling. Around them the octopus waves an arm, the turtle swims, a pink fish leaps, and Water, the big wave, laughs beside them.</desc>
