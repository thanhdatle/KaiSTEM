<title id="t">Morning</title>
<desc id="d">Paper-cut scene: on a bright snowy morning, the mother in a pink and cream hanbok stands outside the cottage holding her baby, who happily munches a dried persimmon. The cow looks out of the cowshed, safe and sound. Far, far away up on the snowy mountain, a tiny tiger peeks out between two pine trees.</desc>
