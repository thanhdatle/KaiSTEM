<title id="t">A light in the woods</title>
<desc id="d">Paper-cut scene: in the woods at dusk, under a big tree, the grey donkey lies down on the left and the brown dog lies down on the right. The ginger cat sits out on a branch, and the white rooster stands at the very top of the tree, looking far away at a little yellow light shining between the trees.</desc>
