<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Up out of the sea</title>
<desc id="d">Paper-cut scene on a sunny beach: Lạc Long Quân, now looking like a tall young man, walks up out of the waves, waving, with sparkles around him. He wears a teal tunic with a gold wave pattern, a blue kilt, a gold star pendant and three teal plumes in his hair. On the sand, villagers, a man, a woman and two children, wave back. A low hut woven from grass stands behind them.</desc>
