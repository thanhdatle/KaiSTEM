<title id="t">Missing the sea</title>
<desc id="d">Paper-cut scene at dusk on a quiet beach: Lạc Long Quân stands alone on the sand, facing us with a small, wistful smile and glancing sideways toward the sea. Out on the sparkling water a fish leaps, and a crescent moon rises in the purple sky.</desc>
