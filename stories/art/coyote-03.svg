<title id="t">Señor Coyote</title>
<desc id="d">Paper-cut scene at dusk, with the full moon rising over the mesas: a tall tan coyote with big pointed ears, a long snout and a bushy black-tipped tail stands by a prickly-pear cactus, his hungry tummy rumbling as he looks around for something to eat.</desc>
