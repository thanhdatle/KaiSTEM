<title id="t">Warm at last</title>
<desc id="d">Paper-cut scene: in warm golden light on the shore, a big campfire crackles in the middle. Around it everyone is warm and smiling: the black raven, the screech owl with red-rimmed eyes and the hooting owl on the left; the horned owl with white eye-rings, the curled-up black snake and the tiny water spider, proud with her woven bowl on her back, on the right.</desc>
