<title id="t">Goodnight, musicians</title>
<desc id="d">Paper-cut scene at night: the robbers' house is dark now. The grey donkey lies asleep on the grass in the yard on the left, the brown dog sleeps by the front door, the ginger cat sleeps curled up by the glowing fire, which you can see through the window, and the white rooster sleeps up on the roof. Little z's float up from them.</desc>
