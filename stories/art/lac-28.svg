<title id="t">Crack! Crack! Crack!</title>
<desc id="d">Paper-cut scene: eggs are cracking open everywhere. In front, a row of happy babies with little black topknots and bright little tunics pop out of their broken egg shells with their arms up, while behind them, on the open bọc, more eggs are cracking.</desc>
