<title id="t">A soft BUMP</title>
<desc id="d">Paper-cut scene: the fox sits up on a soft, round grassy hill, a little dizzy, with three yellow stars circling his head, but not hurt. Quinoa seeds and little potatoes fly out all around him, and the broken end of the grass rope lies beside him. Two green parrots fly overhead.</desc>
