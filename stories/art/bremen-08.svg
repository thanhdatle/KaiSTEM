<title id="t">Up they climb!</title>
<desc id="d">Paper-cut scene at night: beside the glowing window of the robbers' house, the four animals stand on each other's backs. At the bottom is the big grey donkey; the brown dog stands on the donkey's back; the ginger cat stands on the dog's back; and the white rooster with his red comb stands right on top, on the cat's back.</desc>
