<title id="t">The fine fur coat</title>
<desc id="d">Paper-cut scene: in front of his little white house, Hodja stands proudly with his arms out, wearing his fine long crimson coat with a wide golden fur collar, fur cuffs, a fur hem and shiny gold buttons. Gold sparkles twinkle around him, and his grey donkey stares with big round eyes.</desc>
