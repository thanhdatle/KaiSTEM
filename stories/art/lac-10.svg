<title id="t">Far, far away</title>
<desc id="d">Paper-cut scene on a calm, sunny sea: far away on the horizon, the giant fish spirit, now very small, swims off out of sight. Near the shore, two long wooden boats sail happily, with smiling villagers waving in them, and two children cheer on the sand.</desc>
