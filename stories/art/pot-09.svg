<title id="t">You did your best</title>
<desc id="d">Paper-cut scene: at the door of the little white house, Ping's father, a tall man in a green tunic with a little moustache, rests one hand gently on Ping's shoulder and smiles. Ping holds his blue-and-white pot of bare soil and looks up, ready to be brave.</desc>
