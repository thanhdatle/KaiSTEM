<title id="t">Seven days of waiting</title>
<desc id="d">Paper-cut scene: seven little golden suns make an arch across the sky, one for each day of waiting. Below, the soft pearly bọc rests on its banana-leaf mat, glowing. Âu Cơ and Lạc Long Quân stand on either side, watching it calmly and patiently.</desc>
