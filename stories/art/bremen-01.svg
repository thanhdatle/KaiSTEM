<title id="t">The Town Musicians of Bremen</title>
<desc id="d">Paper-cut cover: on a sunny country road, four animals walk in a line to the right — a grey donkey, a brown dog, a ginger striped cat and a white rooster with a red comb and a green tail — towards a wooden signpost with an arrow pointing the way, painted with a tiny town of towers and red roofs. Little music notes float above them.</desc>
