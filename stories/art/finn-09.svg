<title id="t">Knock, knock!</title>
<desc id="d">Paper-cut scene: inside the giant house, the front door stands open and the huge giant Benandonner bends down to peer in. His big bearded face and blue shoulders fill the whole doorway, and one big hand holds the door frame. Oonagh stands in the room with a finger to her lips, and in the giant cradle Finn, in his baby bonnet, pretends to be asleep.</desc>
