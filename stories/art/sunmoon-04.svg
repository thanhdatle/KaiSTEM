<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Water's many people</title>
<desc id="d">Paper-cut scene: the Sun stands on the beach with his arms open, asking Water to visit. Water, the big blue wave, smiles and kindly shakes his head, while all his people peek out of the sea around him: three fish, an octopus, a crab on a rock, a turtle, and a whale's tail sticking up out of the sea. The Sun's little round house looks tiny on the hill behind.</desc>
