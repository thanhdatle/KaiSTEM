<title id="t">Rice in bamboo tubes</title>
<desc id="d">Paper-cut scene in warm evening light beside a bamboo grove: rice cooks in green bamboo tubes leaning over a crackling fire, with steam puffing out of their tops. Lạc Long Quân points to show how, while a child holding a bowl, a woman, and a man holding a bowl watch, smiling.</desc>
