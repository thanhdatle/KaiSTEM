<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">An emperor who loved flowers</title>
<desc id="d">Paper-cut scene: an old emperor with a long white beard, a small gold crown on his white topknot and a long yellow robe with a red sash stands smiling in his palace garden with his arms open wide. Flowers grow all around him — pink and red peonies, yellow and white chrysanthemums and purple flowers — and two butterflies flutter by. A golden palace roof shows over the wall behind.</desc>
