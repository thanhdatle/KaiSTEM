<title id="t">Don't open it!</title>
<desc id="d">Paper-cut scene: the Great Snake rises up out of the river beside the canoe, with his long teal-green neck, his kind face and a little forked tongue. On the water between them floats the dark tucumã nut, sealed with golden wax. The littlest helper, in teal at the front of the canoe, reaches out to take it, while the other two helpers watch.</desc>
