<title id="t">Only day, day, day</title>
<desc id="d">Paper-cut scene: long ago, under a big blazing sun, a thatched house on stilts stands in the rainforest. In a red hammock slung between two posts, a man lies with droopy, tired eyes, yawning. Up on a branch, a black toucan with a big orange beak gives a huge yawn too.</desc>
