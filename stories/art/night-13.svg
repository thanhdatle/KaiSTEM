<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Goodnight, night</title>
<desc id="d">Paper-cut scene: a calm night in the forest with stars and a few fireflies. Two hammocks hang side by side between three posts, and in each one somebody sleeps snugly: the daughter of the Great Snake in a green hammock and her husband in a purple one. Up on a branch on the left, the toucan sleeps with his eye closed, and a little frog sits on a lily pad by the water. Soft z's float up.</desc>
