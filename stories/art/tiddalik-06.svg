<title id="t">The thirsty animals</title>
<desc id="d">Paper-cut scene: on the dry red earth, the thirsty animals gather under a drooping gum tree to make a plan — Kookaburra on a branch, Koala at the foot of the tree, Kangaroo, Wombat and Emu — while behind the hills, huge round Tiddalik rises up as big as a hill himself.</desc>
