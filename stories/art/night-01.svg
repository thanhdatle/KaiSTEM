<title id="t">How the Night Came</title>
<desc id="d">Paper-cut cover: on a wide green river in the rainforest, under a bright sun, three helpers sit in a long wooden canoe. The oldest, in red, paddles at the back; the middle one, in yellow, holds a dark tucumã nut sealed with a band of golden wax; the littlest, in teal, paddles at the front. Palm trees and round treetops line the bank.</desc>
