<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Out spilled the night!</title>
<desc id="d">Paper-cut scene: the tucumã nut has popped open by the fire, and a great dark-blue swirl of night pours out of it and spreads across the sky, full of twinkling stars and glowing yellow fireflies. Low down on the right the sky is still pale. The three helpers, still sitting on the sand, throw their arms in the air, open-mouthed with surprise.</desc>
