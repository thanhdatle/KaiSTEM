<title id="t">Atoq the fox</title>
<desc id="d">Paper-cut scene: on the golden grassland at the foot of huge snowy mountains stands a red-brown Andean fox with tall pointed ears, a white chin, a grey back and a long bushy grey tail with a black tip. High in the sky above, the great black condor soars with his wings spread.</desc>
