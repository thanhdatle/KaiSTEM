<title id="t">Happy at home</title>
<desc id="d">Paper-cut scene on a golden morning: smoke curls from the chimney of the cosy timber-framed house with its red roof and flowers by the door. On the grass in front, the four friends make music together in a row — the grey donkey, the brown dog, the ginger cat and the white rooster — with music notes floating up around them.</desc>
