<title id="t">WAAH!</title>
<desc id="d">Paper-cut scene: inside the giant house, the enormous baby, Finn in his frilly bonnet and white nightie, sits up in the giant cradle with his arms in the air, crying WAAH with his mouth wide open. Benandonner leaps back in surprise with both hands up, his eyes wide. Oonagh stands by the door with a little smile.</desc>
