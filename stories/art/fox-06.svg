<title id="t">I'm the best!</title>
<desc id="d">Paper-cut scene: on the cloud, the fox stands up on his hind legs, one paw in the air, boasting with his mouth wide open and seeds in his fur. The big condor stands on the other side of the striped cloth and frowns. Two of the bowls are already empty.</desc>
