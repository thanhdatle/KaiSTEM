<title id="t">Slowly, slowly with Abebe</title>
<desc id="d">Paper-cut scene: in front of the round house, Bizunesh sits quietly on the grass with a basket of warm bread beside her, smiling. Abebe stands a little way off on the right and peeks at her with a tiny, shy smile.</desc>
