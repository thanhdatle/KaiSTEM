<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Melting the wax</title>
<desc id="d">Paper-cut scene: far from home, the empty canoe is pulled up on a sandy bank. The three helpers sit cross-legged on the sand around a tiny campfire: the oldest in red and the middle one in yellow warm their hands, and the littlest in teal sits at the end. The sealed tucumã nut sits by the fire, and its golden wax is starting to drip. The sun is lower now over the river.</desc>
